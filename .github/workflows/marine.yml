name: Marine Ops · APK

on:
  push:
    branches: [marine-ops]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: app
        run: |
          flutter create --platforms=android --org com.marineops --project-name marine_ops .
          rm -rf test
      - name: Patch Android
        run: python3 tool/patch_android.py app
      - name: Analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || {
            grep -E "error •" analyze.log | head -20 | while read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Build APK
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            grep -E "error|Error:" build.log | head -20 | while read -r l; do echo "::error::$l"; done; exit 1; }
          cp build/app/outputs/flutter-apk/app-release.apk ../MarineOps.apk
          ls -l ../MarineOps.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MarineOps-apk
          path: MarineOps.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marine-ops-latest
          name: Marine Operations · Android
          target_commitish: marine-ops
          body: "تطبيق Marine Operations — حمّل MarineOps.apk وثبّته على Android 6 أو أحدث."
          files: MarineOps.apk
          make_latest: false
