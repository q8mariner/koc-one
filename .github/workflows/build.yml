name: KOC ONE · build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.koc --project-name koc_one .
          rm -rf test
      - name: Patch Android (permissions, tones, SDK levels)
        run: python3 tool/patch_android.py mobile
      - name: Dependencies & analysis
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../KOC-ONE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KOC-ONE-apk
          path: KOC-ONE.apk
      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KOC ONE · Android
          body: "آخر نسخة من تطبيق الموظف KOC ONE — حمّل الملف KOC-ONE.apk وثبّته على جهاز Android 7 أو أحدث."
          files: KOC-ONE.apk
          make_latest: true

  dashboard:
    name: ORT dashboard → GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
