name: KOC ONE · build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.koc --project-name koc_one .
          rm -rf test
      - name: Patch Android (permissions, tones, SDK levels)
        run: python3 tool/patch_android.py mobile
      - name: Dependencies & analysis
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build release APK
        working-directory: mobile
        run: |
          # one APK per processor type instead of one APK carrying all three (same code, same features)
          set -o pipefail
          flutter build apk --release --split-per-abi --split-debug-info=build/symbols 2>&1 | tee build.log || {
            grep -E "error|Error:" build.log | head -20 | while read -r l; do echo "::error::$l"; done; exit 1; }
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../KOC-ONE.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../KOC-ONE-32bit.apk
          ls -l ../KOC-ONE*.apk
          echo "### APK sizes" >> $GITHUB_STEP_SUMMARY
          ls -l ../KOC-ONE*.apk | awk '{printf "- %s: %.1f MB\n", $9, $5/1048576}' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: KOC-ONE-apk
          path: KOC-ONE*.apk
      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KOC ONE · Android
          body: "آخر نسخة من تطبيق الموظف ONE — حمّل KOC-ONE.apk (لكل الهواتف الحديثة) وثبّته على Android 7 أو أحدث. للهواتف القديمة جدًا (32-bit) فقط: KOC-ONE-32bit.apk"
          files: |
            KOC-ONE.apk
            KOC-ONE-32bit.apk
          make_latest: true

  ort:
    name: ONE ORT (dashboard app)
    runs-on: ubuntu-latest
    needs: apk   # publish after the employee app so both land in the same release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: ort
        run: |
          flutter create --platforms=android --org com.koc --project-name one_ort .
          rm -rf test
      - name: Patch Android
        run: python3 tool/patch_ort.py ort
      - name: Build
        working-directory: ort
        run: |
          set -o pipefail
          flutter pub get
          flutter build apk --release --split-per-abi 2>&1 | tee build.log || {
            grep -E "error|Error:" build.log | head -20 | while read -r l; do echo "::error::$l"; done; exit 1; }
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../ONE-ORT.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../ONE-ORT-32bit.apk
          ls -l ../ONE-ORT*.apk | awk '{printf "- %s: %.1f MB\n", $9, $5/1048576}' >> $GITHUB_STEP_SUMMARY
      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            ONE-ORT.apk
            ONE-ORT-32bit.apk

  dashboard:
    name: ORT dashboard → GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
